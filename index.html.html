<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SERRASALMUS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#ffffff;
font-family:Arial, Helvetica, sans-serif;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

.container{

text-align:center;

}

.logo{

font-size:180px;

font-weight:100;

letter-spacing:-15px;

margin-bottom:20px;

}

.company{

font-size:40px;

letter-spacing:15px;

font-weight:300;

margin-bottom:25px;

}

.subtitle{

font-size:18px;

letter-spacing:6px;

color:#666;

margin-bottom:50px;

text-transform:uppercase;

}

.quote{

font-size:18px;

letter-spacing:4px;

font-style:italic;

margin-bottom:60px;

color:#222;

}

button{

padding:18px 55px;

background:black;

color:white;

border:none;

letter-spacing:8px;

cursor:pointer;

transition:.4s;

font-size:14px;

}

button:hover{

background:#444;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

S

</div>

<div class="company">

SERRASALMUS

</div>

<div class="subtitle">

International Commodity Broker
<br>
&
<br>
Maritime Consultants

</div>

<div class="quote">

Precision Before Promise.

</div>

<button>

ENTER

</button>

</div>

</body>

</html>
